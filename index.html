<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>오늘의 사설</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#121722;--muted:#697386;--line:#e5e7eb;--gold:#f3b41b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif}body{min-height:100vh}body.modal-lock{position:fixed;left:0;right:0;overflow:hidden}
.app{max-width:760px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:20;padding:12px 14px 9px;background:rgba(244,245,247,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}.brand-right{display:flex;align-items:center;gap:7px}.date{font-size:15px;color:var(--text);font-weight:600}.sync{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:700;cursor:pointer}.sync:hover{background:#f0f2f5}.sync.loading{opacity:0.6}
main{padding:14px 14px 92px}.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:13px;font-size:12px;color:var(--muted);line-height:1.55}.section-title{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 9px}.section-title strong{font-size:14px}.section-title span{font-size:11px;color:var(--muted)}
.paper-block{position:relative}.paper-block.dragging{opacity:.5}.paper-block.drop-target{outline:2px dashed #9ca3af;outline-offset:4px}.section-title.drag-zone{touch-action:none;user-select:none;cursor:grab}.drag-handle{font-size:16px;color:#9aa2b1;margin-right:7px;user-select:none}.drag-tip{font-size:10px;color:#9aa2b1}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:7px;box-shadow:0 1px 5px #00000006;transition:transform .12s;cursor:pointer}.card:active{transform:scale(.994)}.card h3{font-size:14px;line-height:1.35;margin:5px 0 4px;letter-spacing:-.3px}.meta{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:10px}.pill{padding:2px 6px;border-radius:999px;background:#f0f2f5}.summary{margin:0;color:#374151;font-size:11.5px;line-height:1.42}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.chosun{background:#1d4ed8}.hani{background:#16a34a}.mk{background:#f59e0b}.hankyung{background:#7c3aed}.empty{padding:35px 10px;text-align:center;color:var(--muted);font-size:12px}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:15;text-align:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;z-index:50;background:#0009;align-items:flex-end;justify-content:center;touch-action:none;overscroll-behavior:contain}.modal.open{display:flex}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fff;border-radius:22px 22px 0 0;padding:17px 17px 30px}.modal-head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.modal-head h2{font-size:19px;line-height:1.45;margin:5px 0 0;letter-spacing:-.4px}.close{width:34px;height:34px;border:0;background:#f0f2f4;border-radius:50%;font-size:21px;line-height:1;cursor:pointer}.m-box{background:#f7f8fa;border-radius:12px;padding:12px;margin:14px 0;font-size:13px;line-height:1.65}.modal-copy{font-size:14px;line-height:1.82;color:#374151;white-space:pre-line}.modal-section{margin-top:14px}.modal-label{font-size:13px;font-weight:800;margin-bottom:5px}.modal-thesis{font-size:13px;line-height:1.7;color:#374151;white-space:pre-line}.open-original{display:block;text-align:center;text-decoration:none;color:#fff;background:#111827;border-radius:12px;padding:12px;font-weight:800;margin-top:15px}.small{font-size:10px;color:#9aa2b1;line-height:1.5;margin-top:10px}
@media(max-width:540px){.brand h1{font-size:19px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><h1>오늘의 사설</h1><div class="brand-right"><span class="date" id="today">2026. 09. 29. (화)</span><button class="sync" id="syncBtn">업데이트</button></div></div>
</header>
<main id="content">
<div class="notice">RSS 피드에서 각 신문사의 최신 사설을 자동으로 수집합니다.<br><span class="drag-tip">신문사 이름 부분을 0.5초 정도 꾹 누른 뒤 위아래로 드래그하세요.</span></div>
</main>
<div class="footer">신문사 이름을 약 0.5초 꾹 누른 뒤 위아래로 드래그하면 순서 변경</div>
</div>

<div class="modal" id="modal"><div class="sheet"><div class="modal-head"><div><div class="meta" id="mm"></div><h2 id="mt"></h2></div><button class="close" id="cx">×</button></div><div class="modal-section"><div class="modal-label">내용</div><p class="modal-copy" id="mb"></p></div><a class="open-original" id="mu" target="_blank" rel="noopener">원문 기사 열기</a><div class="small">외부 링크로 연결합니다.</div></div></div>

<script>
const PAPERS={chosun:'조선일보',hani:'한겨레',mk:'매일경제',hankyung:'한국경제'};
const RSS_FEEDS={
  chosun:'https://www.chosun.com/opinion/feed/',
  hani:'https://www.hani.co.kr/rss/opinion/editorial.xml',
  mk:'https://www.mk.co.kr/rss/opinion/editorial/',
  hankyung:'https://www.hankyung.com/api/feed/news/editorial'
};

const S={data:[],modal:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byDate=arr=>[...arr].sort((a,b)=>(b.d||'').localeCompare(a.d||''));

function latestByPaper(){const out={};for(const a of S.data){if(!out[a.p]||a.d>out[a.p].d)out[a.p]={d:a.d,arr:[a]};else if(a.d===out[a.p].d)out[a.p].arr.push(a)}return out}

function card(a){return `<article class="card" data-id="${esc(a.id)}"><div class="meta"><i class="dot ${esc(a.p)}"></i><b>${esc(PAPERS[a.p]||a.p)}</b><span>·</span><span>${esc(a.d)}</span><span class="pill">${esc(a.y)}</span></div><h3>${esc(a.t)}</h3><p class="summary">${esc(a.s)}</p></article>`}

function getPaperOrder(){try{const saved=JSON.parse(localStorage.getItem('paper_order')||'[]');const base=Object.keys(PAPERS);return [...saved.filter(x=>base.includes(x)),...base.filter(x=>!saved.includes(x))]}catch{return Object.keys(PAPERS)}}

function savePaperOrder(order){localStorage.setItem('paper_order',JSON.stringify(order))}

function renderMain(){const g=latestByPaper();const order=getPaperOrder();let h=`<div class="notice">RSS 피드에서 각 신문사의 최신 사설을 자동으로 수집합니다.<br><span class="drag-tip">신문사 이름 부분을 0.5초 정도 꾹 누른 뒤 위아래로 드래그하세요.</span></div>`;for(const p of order){const x=g[p]||{arr:[],d:''};h+=`<section class="paper-block" data-paper="${p}"><div class="section-title drag-zone"><strong><span class="drag-handle">☷</span>${PAPERS[p]}</strong><span>${x.d||'자료 없음'} · ${x.arr?.length||0}건</span></div>${x.arr?.length?byDate(x.arr).map(card).join(''):`<div class="empty">아직 로드되지 않았습니다.</div>`}</section>`}$('#content').innerHTML=h;enablePaperDrag()}

function $(s){return document.querySelector(s)}

function render(){renderMain()}

let lockedScrollY=0;
function lockPage(){lockedScrollY=window.scrollY||window.pageYOffset||0;document.body.classList.add('modal-lock');document.body.style.top=`-${lockedScrollY}px`;document.body.style.width='100%';document.body.style.overflow='hidden';}
function unlockPage(){document.body.classList.remove('modal-lock');const y=lockedScrollY;document.body.style.top='';document.body.style.width='';document.body.style.overflow='';window.scrollTo(0,y);}

function openModal(id,push=true){const a=S.data.find(x=>x.id===id);if(!a)return;if(push)history.pushState({modal:true},'','#article');$('#mm').innerHTML=`<i class="dot ${esc(a.p)}"></i><b>${esc(PAPERS[a.p])}</b> · ${esc(a.d)} · ${esc(a.y)}`;$('#mt').textContent=a.t;$('#mb').textContent=a.s;$('#mu').href=a.u;$('#modal').classList.add('open');lockPage()}

function closeModal(fromPop=false){if(!$('#modal').classList.contains('open'))return;if(!fromPop&&location.hash==='#article'){history.back();return}$('#modal').classList.remove('open');unlockPage()}

document.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openModal(c.dataset.id)});

function enablePaperDrag(){
  document.querySelectorAll('.paper-block').forEach(block=>{
    const grip=block.querySelector('.drag-zone');
    let timer=null,dragging=false,moved=false,activePointer=null;
    const clearTimer=()=>{if(timer){clearTimeout(timer);timer=null}};
    const cleanup=save=>{
      clearTimer();
      if(!dragging)return;
      dragging=false;activePointer=null;
      document.querySelectorAll('.paper-block').forEach(x=>x.classList.remove('dragging','drop-target'));
      if(save)savePaperOrder([...document.querySelectorAll('.paper-block')].map(x=>x.dataset.paper));
    };
    grip.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      activePointer=e.pointerId;moved=false;clearTimer();
      try{grip.setPointerCapture(e.pointerId)}catch{}
      timer=setTimeout(()=>{dragging=true;block.classList.add('dragging');try{navigator.vibrate?.(30)}catch{}},500);
    });
    grip.addEventListener('pointermove',e=>{
      if(activePointer!==e.pointerId)return;
      if(!dragging){if(Math.abs(e.movementX)+Math.abs(e.movementY)>4){moved=true;clearTimer();}return;}
      e.preventDefault();
      const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.paper-block');
      if(!target||target===block)return;
      document.querySelectorAll('.paper-block').forEach(x=>x.classList.remove('drop-target'));
      target.classList.add('drop-target');
      const r=target.getBoundingClientRect();
      if(e.clientY>r.top+r.height/2)target.after(block); else target.before(block);
    });
    grip.addEventListener('pointerup',e=>{if(activePointer===e.pointerId)cleanup(dragging)});
    grip.addEventListener('pointercancel',()=>cleanup(false));
    grip.addEventListener('lostpointercapture',()=>{if(dragging)cleanup(true);else clearTimer()});
  });
}

$('#cx').onclick=()=>closeModal();
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
$('#modal').addEventListener('touchmove',e=>{if(e.target===e.currentTarget)e.preventDefault()},{passive:false});
window.onpopstate=()=>closeModal(true);

async function fetchWithProxy(url){
  try{
    const proxyUrl=`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const r=await fetch(proxyUrl);
    const data=await r.json();
    return new DOMParser().parseFromString(data.contents,'text/xml');
  }catch(e){
    console.error(`프록시 오류 (${url}):`,e);
    return null;
  }
}

async function loadFeed(paper,feedUrl){
  try{
    const xml=await fetchWithProxy(feedUrl);
    if(!xml)return{articles:[],status:{error:'네트워크 오류'}};

    const articles=[];
    const items=xml.querySelectorAll('item');

    for(let i=0;i<Math.min(items.length,3);i++){
      try{
        const item=items[i];
        const title=item.querySelector('title')?.textContent||'제목 없음';
        const link=item.querySelector('link')?.textContent||'';
        const pubDate=item.querySelector('pubDate')?.textContent||new Date().toISOString();

        let date=pubDate.split(',')[1]?.trim().split(' ')[0]||new Date().toISOString().split('T')[0];
        if(date.includes('-'))date=date.substring(0,10);
        else date=new Date(pubDate).toISOString().split('T')[0];

        const desc=item.querySelector('description')?.textContent||title;

        articles.push({
          id:`${paper}-${date}-${Math.random().toString(36).slice(2,9)}`,
          p:paper,
          d:date,
          t:title,
          y:'사설',
          s:desc.substring(0,100),
          u:link
        });
      }catch(e){console.error('아이템 파싱 오류:',e);continue;}
    }

    return{articles,status:{success:articles.length>0,count:articles.length}};
  }catch(e){
    return{articles:[],status:{error:e.message}};
  }
}

async function load(){
  const btn=$('#syncBtn');
  btn.classList.add('loading');
  btn.disabled=true;
  btn.textContent='로딩중...';

  S.data=[];

  for(const[paper,url] of Object.entries(RSS_FEEDS)){
    const result=await loadFeed(paper,url);
    S.data.push(...result.articles);
  }

  render();

  btn.classList.remove('loading');
  btn.disabled=false;
  btn.textContent='업데이트';
}

$('#syncBtn').onclick=()=>load();
$('#today').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'});

// 앱 시작
load();
</script>
</body>
</html>
